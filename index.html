<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroQuiz Sustentável</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🌱 AgroQuiz Sustentável</h1>
    <p>Teste seus conhecimentos sobre sustentabilidade no campo</p>
</header>

<main>

<div class="quiz-container">

    <div class="pergunta">
        <h2>1. Qual prática ajuda a conservar o solo?</h2>

        <label>
            <input type="radio" name="q1" value="10">
            Plantio Direto
        </label>

        <label>
            <input type="radio" name="q1" value="0">
            Queimadas
        </label>

        <label>
            <input type="radio" name="q1" value="0">
            Desmatamento
        </label>
    </div>

    <div class="pergunta">
        <h2>2. Qual fonte de energia é renovável?</h2>

        <label>
            <input type="radio" name="q2" value="10">
            Energia Solar
        </label>

        <label>
            <input type="radio" name="q2" value="0">
            Carvão Mineral
        </label>

        <label>
            <input type="radio" name="q2" value="0">
            Diesel
        </label>
    </div>

    <div class="pergunta">
        <h2>3. Como economizar água na agricultura?</h2>

        <label>
            <input type="radio" name="q3" value="10">
            Irrigação por Gotejamento
        </label>

        <label>
            <input type="radio" name="q3" value="0">
            Desperdício de água
        </label>

        <label>
            <input type="radio" name="q3" value="0">
            Vazamentos
        </label>
    </div>

    <button id="corrigir">Ver Resultado</button>

    <div id="resultado"></div>

</div>

</main>

<footer>
    Projeto Agrinho 2026
    Criado por José Consani
</footer>

<script src="script.js"></script>

</body>
</html>
